<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- White-font SIERRO logo (black bg) — matches the PWA manifest icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <!-- iOS home-screen icon must be PNG (SVG apple-touch-icon is ignored) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sierro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Sierro Design System fonts: Anton (display/page-title) + Inter (content) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Sierro</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Handoff illustrations: the ds-*.svg files (except ds-device-empty.svg) wrap an
         opaque JPEG that was authored on the 4.7.53 #0b0b0b canvas. b55edb5 restored the
         Figma #141414, so they draw a dark rectangle. This filter adds the 9/255 gap back
         to every channel, which turns the matte into exactly #141414 and lifts the artwork
         by the same amount, keeping the faint radar rings intact.
         Proper fix: re-export them with transparency, as ds-device-empty.svg already is. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="ds-unmatte" color-interpolation-filters="sRGB">
        <feComponentTransfer>
          <feFuncR type="linear" slope="1" intercept="0.0353" />
          <feFuncG type="linear" slope="1" intercept="0.0353" />
          <feFuncB type="linear" slope="1" intercept="0.0353" />
        </feComponentTransfer>
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
