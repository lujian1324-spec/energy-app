# AWS App Runner build/run config for the Sierro relay (server/).
# Use with App Runner → "Source: GitHub", Source directory: server
# Secrets (TOKEN_ENC_KEY, and any push-channel keys) are set in the App Runner
# console as environment variables — NEVER commit them here.
version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm install
run:
  command: node index.js
  network:
    port: 8787
  env:
    # Non-secret runtime config. TOKEN_ENC_KEY is added in the console.
    - name: POLLER_ENABLED
      value: "true"
    - name: PORT
      value: "8787"
    - name: POLL_INTERVAL_MS
      value: "60000"
    # iOS: the app ships aps-environment=production (App.entitlements), so its
    # tokens are production tokens — the sandbox gateway rejects every one with
    # BadDeviceToken. The topic must be the iOS bundle id, which is NOT the
    # Android applicationId (com.sierro.energyapp). Neither is a secret; the
    # .p8 and its key/team ids stay in the console.
    - name: APNS_PRODUCTION
      value: "true"
    - name: APNS_BUNDLE_ID
      value: "com.sierro.energy"
